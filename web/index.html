<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111113" />
    <meta name="description" content="Back up your Umbrel photos and videos to Google Photos." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GP Sync" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- Umbrel asks for a login cookie: without credentials the manifest gets the login page and the app can't install. -->
    <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials" />
    <title>GP Sync</title>
  </head>
  <body>
    <div id="app"></div>
    <noscript>GP Sync needs JavaScript. Status as JSON: <a href="api/status">api/status</a></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
